# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).
# Workspace crates are MPL-2.0 and `publish = false`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono 0.4.45 is also required by SeaORM 2.0.4; revisit when its time integration changes. This exception covers the unmaintained notice only." },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates refer to each other by path only.
allow-wildcard-paths = true
# Native TLS stacks and aws-lc need a C toolchain on every NAS target; rustls + ring only.
deny = [
    { crate = "openssl" },
    { crate = "openssl-sys" },
    { crate = "native-tls" },
    { crate = "aws-lc-rs" },
    { crate = "aws-lc-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
