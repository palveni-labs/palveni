[workspace]
resolver = "3"

[package]
name = "palveni-smb-helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MPL-2.0"
publish = false

[dependencies]
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smb2 = { version = "=0.43.0", default-features = false, features = ["tokio"] }
tokio = { version = "1.54.1", features = ["io-std", "io-util", "macros", "rt", "time"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = "symbols"
